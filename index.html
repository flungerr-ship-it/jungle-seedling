<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body style="margin:0">
<title>Jungle Seedling</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;600&display=swap">
<style>
/* Layout: one full-bleed painted canvas; a small field-journal card floats bottom-left. Single dark "painted jungle" look. */
:root{
  --night:#0f1d17;
  --card:rgba(16,34,24,.82);
  --ink:#efe6cf;
  --ink-soft:#c3c9a8;
  --leaf:#9fbd57;
  --bloom:#e9773a;
  --line:rgba(239,230,207,.18);
  --display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body:Karla, "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.card{
  position:fixed;
  left:max(16px, calc(env(safe-area-inset-left, 0px) + 12px));
  bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);
  width:min(300px, calc(100vw - 32px));
  background:var(--card);
  border:1px solid var(--line);
  border-radius:6px;
  padding:14px 16px 14px;
  display:flex;flex-direction:column;gap:10px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:600;font-size:1.55rem;line-height:1;margin:0;letter-spacing:.01em}
.stage{font-family:var(--display);font-style:italic;font-size:1.05rem;color:var(--leaf);white-space:nowrap}
.meters{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:.78rem}
.meters .lab{text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);font-size:.68rem}
.bar{height:6px;border-radius:3px;background:rgba(239,230,207,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--leaf);transition:width .25s linear}
#barLight i{background:#f0c86a}
#barMove i{background:#8fc3b0}
#barGrow i{background:var(--bloom)}
.val{font-variant-numeric:tabular-nums;color:var(--ink-soft);min-width:4.6em;text-align:right}
.pick{display:flex;align-items:center;gap:10px}
.pick .lab{text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);font-size:.68rem}
select{flex:1;min-width:0;font:600 .85rem/1.2 var(--body);color:var(--ink);background:#1b3325;border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.habit{margin:0;font-family:var(--display);font-style:italic;font-size:.98rem;line-height:1.3;color:var(--ink-soft)}
.bar.sun{position:relative;overflow:visible;background:linear-gradient(90deg,rgba(239,230,207,.12),rgba(240,200,106,.3),rgba(239,230,207,.12))}
.bar.sun b{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#f0c86a;left:50%}
.check{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--ink-soft);cursor:pointer}
.check input{accent-color:#9fbd57;width:16px;height:16px;margin:0}
.camtext{display:flex;flex-direction:column;gap:4px;min-width:0}
.status{font-size:.8rem;line-height:1.4;color:var(--ink-soft);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{
  font:600 .78rem/1 var(--body);color:var(--ink);background:rgba(239,230,207,.08);
  border:1px solid var(--line);border-radius:4px;padding:8px 10px;cursor:pointer;
}
button:hover{background:rgba(239,230,207,.16)}
button:focus-visible,input:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
button.primary{background:var(--leaf);color:#14281a;border-color:transparent}
button.primary:hover{background:#b3cf6c}
button[aria-pressed="true"]{background:rgba(233,119,58,.28);border-color:rgba(233,119,58,.6)}
.slider{display:flex;align-items:center;gap:10px;font-size:.75rem;color:var(--ink-soft)}
.slider input{flex:1;accent-color:#f0c86a}
video{width:96px;height:72px;object-fit:cover;transform:scaleX(-1);border-radius:3px;border:1px solid var(--line);background:#000}
.camrow{display:flex;gap:10px;align-items:center}
.hidebtn{background:none;border:none;padding:2px 0;color:var(--ink-soft);font-weight:400;text-decoration:underline;text-underline-offset:2px}
.hidebtn:hover{background:none;color:var(--ink)}
#showBtn{
  position:fixed;left:max(16px, calc(env(safe-area-inset-left, 0px) + 12px));
  bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);background:var(--card)
}
@media (max-width:600px){
  .card{bottom:auto;top:calc(env(safe-area-inset-top, 0px) + 12px);padding:10px 12px;gap:8px}
  #showBtn{bottom:auto;top:calc(env(safe-area-inset-top, 0px) + 12px)}
  #status,.habit{display:none}
  h1{font-size:1.3rem}
  video{width:64px;height:48px}
}
</style>

<canvas id="scene" aria-label="A painted jungle with one plant growing in the centre"></canvas>

<section class="card" id="card" aria-live="polite">
  <div class="head">
    <h1>Jungle Seedling</h1>
    <span class="stage" id="stage">Seedling</span>
  </div>
  <label class="pick" for="plantType"><span class="lab">Plant</span>
    <select id="plantType">
      <option value="flower">Flowering vine</option>
      <option value="monstera">Monstera deliciosa</option>
      <option value="orchid">Orchid (Phalaenopsis)</option>
      <option value="fern">Fern</option>
      <option value="rhodo">Rhododendron</option>
    </select>
  </label>
  <p class="habit" id="habit"></p>
  <div class="meters">
    <span class="lab">Light</span><span class="bar" id="barLight"><i></i></span><span class="val" id="valLight">–</span>
    <span class="lab">Sun from</span><span class="bar sun" id="barSun"><b id="sunDot"></b></span><span class="val" id="valSun">right</span>
    <span class="lab">Movement</span><span class="bar" id="barMove"><i></i></span><span class="val" id="valMove">–</span>
    <span class="lab">Growth</span><span class="bar" id="barGrow"><i></i></span><span class="val" id="valGrow">0%</span>
  </div>
  <div class="camrow" id="camRow" hidden>
    <video id="cam" playsinline muted></video>
    <div class="camtext">
      <p class="status">The plant is watching you. The sun follows the side you move toward.</p>
      <p class="status" id="drinkStatus"></p>
    </div>
  </div>
  <p class="status" id="status">Move your pointer over the jungle: the sun follows it and the plant grows toward the light. Or let it see you through your camera.</p>
  <label class="slider" id="lightWrap" for="lightSlider">Room light <input id="lightSlider" type="range" min="0" max="100" value="72"></label>
  <div class="row">
    <button class="primary" id="camBtn" type="button">Use camera</button>
    <button id="rainBtn" type="button">Let it rain</button>
    <button id="fastBtn" type="button" aria-pressed="false">Grow faster</button>
    <button id="resetBtn" type="button">Plant a new seed</button>
  </div>
  <label class="check" for="autoSeed"><input type="checkbox" id="autoSeed" checked> Plant a new seed when fully grown</label>
  <div class="row"><button class="hidebtn" id="hideBtn" type="button">Hide panel</button></div>
</section>
<button id="showBtn" type="button" hidden>Show panel</button>

<script>
(() => {
"use strict";
const cvs = document.getElementById("scene");
const ctx = cvs.getContext("2d");
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- small helpers ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => 1 - Math.pow(1 - clamp(t), 2.2);
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
function rng(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}
function rgb(c) {
  if (Array.isArray(c)) return c;
  const n = parseInt(c.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mix(a, b, t) { a = rgb(a); b = rgb(b); return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function shade(c, amt) { return amt >= 0 ? mix(c, [255, 250, 225], amt) : mix(c, [6, 14, 10], -amt); }
function css(c, a = 1) { c = rgb(c); return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
const pick = (R, arr) => arr[(R() * arr.length) | 0];

/* ---------- leaf drawing ----------
   Every leaf is drawn along its local +x axis: a curved midrib with a width profile on each side. */
const PROF = {
  lance: s => Math.pow(Math.sin(Math.PI * s), 0.8) * (1 - 0.35 * s),
  heart: s => Math.pow(Math.sin(Math.PI * s), 0.6) * Math.pow(1 - s * 0.85, 0.8) * 1.4,
  oblong: s => Math.pow(Math.sin(Math.PI * s), 0.35),
  narrow: s => Math.sin(Math.PI * s),
  monstera: s => Math.pow(Math.sin(Math.PI * s), 0.3 + 0.6 * s) * (1 - 0.25 * s),
  pinna: s => Math.pow(Math.sin(Math.PI * s), 0.7) * (0.72 + 0.28 * Math.abs(Math.sin(s * Math.PI * 7))),
  ellip: s => Math.pow(Math.sin(Math.PI * s), 0.75) * (1 - 0.2 * s),
  petal: s => Math.pow(Math.sin(Math.PI * s), 0.7) * (0.7 + 0.5 * s * (1 - s) * 4) * 0.8
};
const scratch = document.createElement("canvas"), sct = scratch.getContext("2d");
function leaf(c, x, y, ang, L, Wd, shape, col, o = {}) {
  if (L < 0.5) return;
  if ((o.fen > 0.05 || shape === "monstera") && !o._in) {   // leaves with holes are painted on their own sheet, so the holes show what is behind
    const Rr = Math.ceil(L * 1.35), sz = Math.ceil(2 * Rr * DPR);
    if (scratch.width < sz) { scratch.width = sz; scratch.height = sz; }
    sct.setTransform(1, 0, 0, 1, 0, 0); sct.clearRect(0, 0, sz, sz);
    sct.setTransform(DPR, 0, 0, DPR, Rr * DPR, Rr * DPR);
    leaf(sct, 0, 0, 0, L, Wd, shape, col, { ...o, _in: true });
    c.save(); c.translate(x, y); c.rotate(ang); c.drawImage(scratch, 0, 0, sz, sz, -Rr, -Rr, 2 * Rr, 2 * Rr); c.restore();
    return;
  }
  const N = o.N || 22, u0 = shape === "heart" || shape === "monstera" ? -0.18 : 0, prof = PROF[shape], bend = o.bend || 0;
  const mid = [], up = [], dn = [];
  for (let k = 0; k <= N; k++) {
    const s = k / N, u = u0 + (1 - u0) * s;
    const mx = u * L, my = bend * L * u * Math.abs(u);
    const dy = 2 * bend * L * Math.abs(u), len = Math.hypot(L, dy);
    const nx = -dy / len, ny = L / len, w = Wd * prof(s) * (o.serr && k % 2 ? 0.86 : 1);
    mid.push([mx, my]); up.push([mx - nx * w, my - ny * w]); dn.push([mx + nx * w, my + ny * w]);
  }
  c.save(); c.translate(x, y); c.rotate(ang);
  if (o.flat) {   // cheap version for the many small pinnae
    c.beginPath(); c.moveTo(up[0][0], up[0][1]);
    for (let k = 1; k <= N; k++) c.lineTo(up[k][0], up[k][1]);
    for (let k = N; k >= 0; k--) c.lineTo(dn[k][0], dn[k][1]);
    c.fillStyle = o.flat; c.fill(); c.restore(); return;
  }
  c.beginPath(); c.moveTo(up[0][0], up[0][1]);
  for (let k = 1; k <= N; k++) c.lineTo(up[k][0], up[k][1]);
  for (let k = N; k >= 0; k--) c.lineTo(dn[k][0], dn[k][1]);
  c.closePath();
  const g = c.createLinearGradient(u0 * L, 0, L, 0);
  g.addColorStop(0, css(shade(col, -0.42))); g.addColorStop(0.5, css(col)); g.addColorStop(1, css(shade(col, 0.26)));
  c.fillStyle = g; c.fill();
  if (o.edge !== false) { c.strokeStyle = css(shade(col, -0.45), 0.55); c.lineWidth = Math.max(0.5, L * 0.004); c.stroke(); }
  if (o.rimA !== 0) {   // the pale rim light along one edge, as in the paintings
    c.strokeStyle = css(shade(col, 0.6), o.rimA ?? 0.45); c.lineWidth = Math.max(0.7, Wd * 0.05);
    c.beginPath(); c.moveTo(up[1][0], up[1][1]); for (let k = 2; k < N; k++) c.lineTo(up[k][0], up[k][1]); c.stroke();
  }
  c.save(); c.clip();
  // one half catches the light, the flat two-tone look of a painted leaf
  c.beginPath(); c.moveTo(up[0][0], up[0][1]);
  for (let k = 1; k <= N; k++) c.lineTo(up[k][0], up[k][1]);
  for (let k = N; k >= 0; k--) c.lineTo(mid[k][0], mid[k][1]);
  c.closePath(); c.fillStyle = css(shade(col, 0.3), o.sheen ?? 0.22); c.fill();
  if (o.veins !== false) {
    const vc = css(shade(col, 0.55), o.veinAlpha ?? 0.7);
    c.strokeStyle = vc; c.lineWidth = Math.max(0.6, Wd * 0.045);
    c.beginPath(); const k0 = Math.round(-u0 / (1 - u0) * N);
    c.moveTo(mid[k0][0], mid[k0][1]); for (let k = k0 + 1; k <= N; k++) c.lineTo(mid[k][0], mid[k][1]); c.stroke();
    const nv = o.nv ?? (shape === "oblong" ? 18 : 7), step = shape === "oblong" ? 1 : 3;
    c.lineWidth = Math.max(0.5, Wd * 0.028);
    for (let j = 1; j <= nv; j++) {
      const k = Math.round(k0 + (N - k0) * (j / (nv + 1)) * 0.95), k2 = Math.min(N, k + step);
      for (const side of [up, dn]) {
        c.beginPath(); c.moveTo(mid[k][0], mid[k][1]);
        c.lineTo(mid[k2][0] + (side[k2][0] - mid[k2][0]) * 0.9, mid[k2][1] + (side[k2][1] - mid[k2][1]) * 0.9);
        c.stroke();
      }
    }
  }
  if (shape === "monstera") {
    // Monstera deliciosa: a notch where the petiole meets the heart-shaped base; with age, oval holes
    // open in a row beside the midrib, then deep splits run in from the margin between the side veins.
    const fen = o.fen || 0, k0 = Math.round(-u0 / (1 - u0) * N), nv = o.nv ?? 7;
    c.globalCompositeOperation = "destination-out"; c.fillStyle = "#000";
    c.beginPath(); c.moveTo(u0 * L - 2, -L * 0.07); c.lineTo(L * 0.03, 0); c.lineTo(u0 * L - 2, L * 0.07); c.closePath(); c.fill();
    const holes = clamp((fen - 0.12) / 0.3), split = clamp((fen - 0.4) / 0.45);
    for (const side of [up, dn]) for (let j = 1; j < nv; j++) {
      const kf = k0 + (N - k0) * ((j + 0.5) / (nv + 1)) * 0.95, k = Math.round(kf), k2 = Math.min(N, k + 3);
      const P = f => [mid[k][0] + (side[k2][0] - mid[k][0]) * f, mid[k][1] + (side[k2][1] - mid[k][1]) * f];
      const ang = Math.atan2(side[k2][1] - mid[k][1], side[k2][0] - mid[k][0]), reach = Math.hypot(side[k2][0] - mid[k][0], side[k2][1] - mid[k][1]);
      if (holes > 0 && (j % 2 === 1 || holes > 0.6)) {
        const [hx, hy] = P(0.17); c.beginPath(); c.ellipse(hx, hy, reach * 0.09 * holes, L * 0.016 * holes, ang, 0, 7); c.fill();
      }
      if (split > 0) {
        const fin = 1 - 0.7 * split, a = P(fin), m = P((fin + 1.2) / 2), e = P(1.2);
        taper(c, bez(a, [m[0] + L * 0.025, m[1]], e, 10), L * 0.018, L * 0.05);
        c.beginPath(); c.arc(a[0], a[1], L * 0.009, 0, 7); c.fill();
      }
    }
    c.globalCompositeOperation = "source-over";
  }
  if (o.tears && o.R) {
    c.globalCompositeOperation = "destination-out"; c.lineWidth = Math.max(1, Wd * 0.05);
    const n = 2 + ((o.R() * 4) | 0);
    for (let j = 0; j < n; j++) {
      const k = 4 + ((o.R() * (N - 7)) | 0), side = o.R() < 0.5 ? up : dn, d = 0.25 + o.R() * 0.5;
      c.beginPath(); c.moveTo(side[k][0] + (side[k][0] - mid[k][0]) * 0.2, side[k][1] + (side[k][1] - mid[k][1]) * 0.2);
      c.lineTo(mid[k][0] + (side[k][0] - mid[k][0]) * d, mid[k][1] + (side[k][1] - mid[k][1]) * d); c.stroke();
    }
  }
  c.restore(); c.restore();
}
function stalk(c, x, y, ang, len, bend, col, w) {
  const ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
  const qx = x + Math.cos(ang) * len * 0.5 - Math.sin(ang) * len * bend * 0.3;

  return [ex, ey, Math.atan2(ey - qy, ex - qx)];

function droopSign(ang) { return Math.cos(ang) >= 0 ? 1 : -1; }

function clump(c, R, x, y, o) {
  for (let i = 0; i < o.n; i++) {
    const ang = (o.dir ?? -Math.PI / 2) + (R() - 0.5) * o.spread;
    const L = o.len * (0.65 + R() * 0.5), col = pick(R, o.colors);
    let px = x, py = y, pa = ang;
    if (o.stalk) [px, py, pa] = stalk(c, x, y, ang, L * o.stalk, droopSign(ang) * 0.5, shade(col, -0.3), Math.max(1, L * 0.018));
    const sgn = droopSign(pa);
    leaf(c, px, py, pa + sgn * (o.tilt ?? 0.25) * R(), L, L * o.wid * (0.8 + R() * 0.4), o.shape, col,

}
function frond(c, x, y, ang, L, col, o = {}) {
  const bend = o.bend ?? droopSign(ang) * 0.4, n = o.n || 16, ll = o.ll || L * 0.32;
  const ca = Math.cos(ang), sa = Math.sin(ang), pts = [];
  for (let k = 0; k <= 24; k++) { const u = k / 24, lx = u * L, ly = bend * L * u * u; pts.push([x + lx * ca - ly * sa, y + lx * sa + ly * ca]); }

  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (const p of pts) c.lineTo(p[0], p[1]); c.stroke();

    const ta = Math.atan2(pts[k2][1] - pts[k][1], pts[k2][0] - pts[k][0]);
    const len = ll * (1 - u * 0.55);
    for (const side of [-1, 1]) {
      const a = ta + side * (o.la || 0.75);
      leaf(c, pts[k][0], pts[k][1], a, len, len * (o.lw || 0.13), "narrow", col, { bend: droopSign(a) * 0.3, nv: 0, N: 10, veinAlpha: 0.35, edge: false });
    }
  }
}
function flower(c, x, y, r, outer, inner, n, ang0 = -Math.PI / 2, spread = Math.PI * 2) {
  for (let k = 0; k < n; k++) {
    const a = ang0 - spread / 2 + spread * (k + 0.5) / n;
    leaf(c, x, y, a, r, r * 0.5, "petal", outer, { veins: false, edge: true, sheen: 0.3 });
  }
  for (let k = 0; k < n; k++) {
    const a = ang0 - spread / 2 + spread * (k + 1) / n;
    leaf(c, x, y, a, r * 0.62, r * 0.32, "petal", inner, { veins: false, edge: false, sheen: 0.35 });
  }
  c.fillStyle = css("#f2c94c"); c.beginPath(); c.arc(x, y, r * 0.16, 0, Math.PI * 2); c.fill();
  c.fillStyle = css("#7a3a1c"); for (let k = 0; k < 7; k++) { const a = k / 7 * Math.PI * 2; c.beginPath(); c.arc(x + Math.cos(a) * r * 0.09, y + Math.sin(a) * r * 0.09, r * 0.025, 0, 7); c.fill(); }
}
function fruit(c, x, y, r) {
  const g = c.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, css("#ffd27a")); g.addColorStop(0.6, css("#ef9a2b")); g.addColorStop(1, css("#b8611d"));
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
}

/* ---------- scene layers (cached; re-drawn on resize) ---------- */
let W = 0, H = 0, DPR = 1, U = 1, layers = [], ANIM = { monkeys: [] };
const LAYER_SWAY = [0.0025, 0.005, 0.008, 0.012];

function makeLayer() {
  const l = document.createElement("canvas");
  l.width = Math.ceil(W * DPR); l.height = Math.ceil(H * DPR);

/* ---------- the plants in the centre ---------- */
const TYPES = {
  flower: { name: "Flowering vine", rate: 1,
    habit: "A climbing vine. A leaf unfolds at each node as the stem rises, then a bud forms at the tip and opens into one large flower." },
  monstera: { name: "Monstera deliciosa", rate: 1,
    habit: "Young plants make small, whole leaves. Each new leaf is larger, first with holes, then with deep splits. Aerial roots grow down to the ground." },
  orchid: { name: "Orchid (Phalaenopsis)", rate: 0.9,
    habit: "Grows from one central crown, a new leaf at a time, alternating left and right. Silvery aerial roots wander out. A flower spike rises from a lower leaf, and its buds open one by one from the base to the tip." },
  fern: { name: "Fern", rate: 1,
    habit: "A ground fern growing from a creeping rhizome. Every frond unrolls from a tight fiddlehead, base first. New fronds rise from the centre, older ones arch outward toward the ground and turn brown." },
  rhodo: { name: "Rhododendron", rate: 0.8,
    habit: "A woody shrub that grows in yearly flushes. Each shoot ends in a whorl of leathery leaves. A flower truss forms at the tip, and new shoots branch out below it." }
};
const NB = 120;
const freshMem = () => ({ p: 0.02, f: 0, bins: new Array(NB).fill(0), fd: [], sd: [] });
const S = { autoSeed: true, fullT: 0, type: "flower", mem: {}, light: 0.72, motion: 0, leanTarget: 0.4, lightDir: 0.4, fast: false, tip: null, bloom: 0, rain: 0, rainLeft: 0, wet: 0 };
for (const k in TYPES) S.mem[k] = freshMem();
try {
  const ty = localStorage.getItem("jungle-seedling-type"); if (TYPES[ty]) S.type = ty;
  for (const k in TYPES) {
    const m = JSON.parse(localStorage.getItem("jungle-seedling-" + k) || "null");
    if (m && m.p >= 0 && m.p <= 1 && Array.isArray(m.bins) && m.bins.length === NB) S.mem[k] = Object.assign(freshMem(), m);
  }
  if (localStorage.getItem("jungle-seedling-autoseed") === "0") S.autoSeed = false;
  const d = parseFloat(localStorage.getItem("jungle-seedling-light")); if (d >= -1 && d <= 1) S.lightDir = S.leanTarget = d;
} catch (e) {}
const M = () => S.mem[S.type];
const stirOf = () => 0.3 + S.motion * 2.2;

// Phototropism: each stretch of stem keeps the light direction it grew under.
// Only the young tissue near the tip still turns toward where the light is now.
function stemPath(mem, grown, maxH, k = 0.32) {
  const f = clamp(grown / maxH), b1 = Math.min(NB, Math.ceil(f * NB));
  for (let b = Math.floor(mem.f * NB); b < b1; b++) mem.bins[b] = S.lightDir;
  mem.f = Math.max(mem.f, f);
  const xs = new Float32Array(NB + 1), ds = maxH / NB;
  for (let b = 0; b < NB; b++) {
    const young = clamp(1 - (f - b / NB) / 0.12);
    const d = mem.bins[b] * (1 - young) + S.lightDir * young;
    xs[b + 1] = xs[b] + Math.sin(d * k) * ds;
  }
  return s => { const q = clamp(s / maxH) * NB, i = Math.min(NB - 1, Math.floor(q)); return xs[i] + (xs[i + 1] - xs[i]) * (q - i); };
}

const NODES = 11;
function drawFlowerPlant(t, p, mem) {
  const maxH = H * 0.66, baseX = W / 2, baseY = H * 0.965, stir = stirOf();
  const grown = maxH * ease((p - 0.02) / 0.72) + H * 0.025;
  const wob = reduceMotion ? 0 : Math.sin(t * 0.9) * 0.025 * stir;
  const bx = stemPath(mem, grown, maxH);

  status.textContent = "Asking for your camera…";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, facingMode: "user" }, audio: false });
    video.srcObject = stream; await video.play();
    camOn = true; prevLuma = null;
    ui("camRow").hidden = false; status.hidden = true; ui("lightWrap").hidden = true; ui("camBtn").hidden = true;
    loadDetectors();
  } catch (e) {
    status.textContent = "The camera isn't available here, so the plant follows your pointer instead. Set the room light with the slider.";
    ui("camBtn").textContent = "Try camera again";
  }
}

cvs.addEventListener("pointermove", e => {
  if (lastPtr) pointerDist += Math.hypot(e.clientX - lastPtr[0], e.clientY - lastPtr[1]);
  lastPtr = [e.clientX, e.clientY];
  if (!camOn) S.leanTarget = clamp((e.clientX / W) * 2 - 1, -1, 1);
});
cvs.addEventListener("pointerleave", () => { lastPtr = null; });
ui("lightSlider").addEventListener("input", e => { rawLight = e.target.value / 100; });
ui("camBtn").addEventListener("click", startCamera);
ui("fastBtn").addEventListener("click", e => { S.fast = !S.fast; e.currentTarget.setAttribute("aria-pressed", S.fast); });
ui("resetBtn").addEventListener("click", () => { S.mem[S.type] = freshMem(); });
ui("rainBtn").addEventListener("click", () => startRain(10));
const typeSel = ui("plantType");
function showType() { typeSel.value = S.type; ui("habit").textContent = TYPES[S.type].habit; }
typeSel.addEventListener("change", () => { if (TYPES[typeSel.value]) { S.type = typeSel.value; showType(); try { localStorage.setItem("jungle-seedling-type", S.type); } catch (e) {} } });
showType();
ui("autoSeed").checked = S.autoSeed;
ui("autoSeed").addEventListener("change", e => { S.autoSeed = e.target.checked; try { localStorage.setItem("jungle-seedling-autoseed", S.autoSeed ? "1" : "0"); } catch (err) {} });
ui("hideBtn").addEventListener("click", () => { ui("card").hidden = true; ui("showBtn").hidden = false; ui("showBtn").focus(); });
ui("showBtn").addEventListener("click", () => { ui("card").hidden = false; ui("showBtn").hidden = true; });

/* ---------- loop ---------- */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = window.innerWidth; H = window.innerHeight;
  U = Math.min(H, W * 1.25) / 900;
  cvs.width = Math.ceil(W * DPR); cvs.height = Math.ceil(H * DPR);
  buildLayers();
}
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 150); });
resize();

function lightWord(l) { return l < 0.15 ? "dark" : l < 0.4 ? "dim" : l < 0.7 ? "soft" : "bright"; }
function moveWord(m) { return m < 0.05 ? "still" : m < 0.3 ? "gentle" : m < 0.65 ? "lively" : "busy"; }

let last = performance.now(), saveT = 0, hudT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const t = now / 1000;
  sampleCamera(now);
  if (!camOn) { rawMotion = clamp(pointerDist / dt / (Math.hypot(W, H) * 0.6) || 0); pointerDist = 0; }
  S.motion += (rawMotion - S.motion) * (1 - Math.exp(-dt * (rawMotion > S.motion ? 4 : 1.2)));
  S.light += (rawLight - S.light) * (1 - Math.exp(-dt * 1.5));
  // the light swings to the side you move toward, and stays there when you stop
  S.lightDir += (S.leanTarget - S.lightDir) * (1 - Math.exp(-dt * 1.2 * clamp(S.motion * 4)));
  S.rainLeft = Math.max(0, S.rainLeft - dt);
  S.rain += ((S.rainLeft > 0 ? 1 : 0) - S.rain) * (1 - Math.exp(-dt * (S.rainLeft > 0 ? 0.9 : 1.6)));
  S.wet = clamp(S.wet + (S.rain * 0.25 - S.wet * 0.02) * dt);
  detectDrinking(now);

  // growth: light is the food, attention (movement) is the encouragement, rain is the water
  const mem = M();
  const food = Math.pow(clamp((S.light * (1 - 0.3 * S.rain) - 0.12) / 0.6), 0.8);
  const rate = (1 / 240) * TYPES[S.type].rate * food * (0.25 + 1.75 * S.motion) * (1 + 1.5 * S.wet) * (S.fast ? 8 : 1);
  mem.p = Math.min(1, mem.p + rate * dt);
  // once fully grown, the plant stays in bloom for a while, then a new seed starts
  if (mem.p >= 1 && S.autoSeed) { S.fullT += dt; if (S.fullT > 25) { S.mem[S.type] = freshMem(); S.fullT = 0; } } else S.fullT = 0;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSky(t);
  const stir = reduceMotion ? 0.15 : 0.35 + S.motion * 3;
  layers.forEach((l, i) => {
    const sk = Math.sin(t * (0.5 + i * 0.17) + i * 1.3) * LAYER_SWAY[i] * stir;
    ctx.save(); ctx.transform(1, 0, sk, 1, -sk * H, 0); ctx.drawImage(l, 0, 0, W, H); drawAnimals(i, t); ctx.restore();
    if (i === 2) drawPlant(t);
  });
  drawDirLight();
  drawNight(t);
  drawRain(dt);

  if (now - hudT > 200) {
    hudT = now;
    ui("barLight").firstElementChild.style.width = (S.light * 100).toFixed(0) + "%";
    ui("barMove").firstElementChild.style.width = (S.motion * 100).toFixed(0) + "%";
    ui("barGrow").firstElementChild.style.width = (mem.p * 100).toFixed(1) + "%";
    ui("sunDot").style.left = ((S.lightDir + 1) * 50).toFixed(1) + "%";
    ui("valSun").textContent = S.rain > 0.5 ? "rain" : S.lightDir < -0.3 ? "left" : S.lightDir > 0.3 ? "right" : "ahead";
    ui("valLight").textContent = lightWord(S.light);
    ui("valMove").textContent = moveWord(S.motion);
    ui("valGrow").textContent = Math.floor(mem.p * 100) + "%";
    let st = stageOf(S.type, mem.p);
    if (food === 0 && mem.p < 1) st = "Resting";
    ui("stage").textContent = st;
  }
  if (now - saveT > 2000) {
    saveT = now;
    try {
      localStorage.setItem("jungle-seedling-" + S.type, JSON.stringify({ ...mem, bins: mem.bins.map(v => Math.round(v * 100) / 100) }));
      localStorage.setItem("jungle-seedling-light", S.lightDir.toFixed(3));
    } catch (e) {}
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

</body>
